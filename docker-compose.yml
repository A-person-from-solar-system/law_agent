services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: law_agent
      POSTGRES_USER: law_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-law_agent_dev}
    ports:
      - "5432:5432"
    volumes:
      - law_agent_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U law_agent -d law_agent"]
      interval: 5s
      timeout: 3s
      retries: 20

  mid-layer:
    build: ./mid-layer
    environment:
      APP_ENV: development
      APP_HOST: 0.0.0.0
      DATABASE_URL: postgresql+asyncpg://law_agent:${POSTGRES_PASSWORD:-law_agent_dev}@postgres:5432/law_agent
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-at-least-32-characters}
      AGENT_ENGINE_BASE_URL: http://agent-engine:3100
      AGENT_ENGINE_SERVICE_TOKEN: ${AGENT_ENGINE_SERVICE_TOKEN:-local-agent-service-token}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-internal-service-token}
      KNOWLEDGE_BACKEND: ${KNOWLEDGE_BACKEND:-rag}
      RAG_BASE_URL: ${RAG_BASE_URL:-http://host.docker.internal:8001}
      RAG_MODE: ${RAG_MODE:-hybrid}
      RAG_TIMEOUT_SECONDS: ${RAG_TIMEOUT_SECONDS:-60}
      KNOWLEDGE_FULL_SOURCE_MAX_CHARS: ${KNOWLEDGE_FULL_SOURCE_MAX_CHARS:-60000}
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  agent-engine:
    build: ./agent-engine
    environment:
      HOST: 0.0.0.0
      PORT: 3100
      MOCK_MODE: ${MOCK_MODE:-true}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-mock}
      MODEL_ID: ${MODEL_ID:-mock-legal-model}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      AGENT_ENGINE_SERVICE_TOKEN: ${AGENT_ENGINE_SERVICE_TOKEN:-local-agent-service-token}
      KNOWLEDGE_BASE_URL: http://mid-layer:8000
      TOOL_TIMEOUT_MS: ${TOOL_TIMEOUT_MS:-65000}
      MAX_INPUT_TOKENS: ${MAX_INPUT_TOKENS:-256000}
      RESERVED_OUTPUT_TOKENS: ${RESERVED_OUTPUT_TOKENS:-12000}
      CONTEXT_SAFETY_TOKENS: ${CONTEXT_SAFETY_TOKENS:-8000}
      TOOL_RESULT_MAX_TOKENS: ${TOOL_RESULT_MAX_TOKENS:-5000}
      TOOL_ITEM_MAX_TOKENS: ${TOOL_ITEM_MAX_TOKENS:-1000}
      TOOL_MAX_EVIDENCE: ${TOOL_MAX_EVIDENCE:-5}
      TOOL_FULL_SOURCE_MAX_TOKENS: ${TOOL_FULL_SOURCE_MAX_TOKENS:-40000}
      TOOL_FULL_SOURCE_MAX_CALLS: ${TOOL_FULL_SOURCE_MAX_CALLS:-1}
      RUN_TIMEOUT_MS: ${RUN_TIMEOUT_MS:-180000}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-local-internal-service-token}
    ports:
      - "3100:3100"
    depends_on:
      mid-layer:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_API_URL: http://mid-layer:8000
    environment:
      BACKEND_API_URL: http://mid-layer:8000
      NEXT_PUBLIC_API_BASE_URL: /backend
    ports:
      - "3000:3000"
    depends_on:
      mid-layer:
        condition: service_healthy
      agent-engine:
        condition: service_healthy

volumes:
  law_agent_pg:
